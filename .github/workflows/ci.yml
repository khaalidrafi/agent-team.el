name: CI

on:
  push:
    branches: [ai/main]
  pull_request:
    branches: [ai/main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq emacs-nox
      - name: Run ert tests
        run: |
          emacs -Q --batch -L . -L tests -l tests/agent-team-test.el \
            --eval '(ert-run-tests-batch-and-exit "agent-team")'
      - name: Notify Lark (webhook)
        if: always()
        run: |
          MSG=$(printf 'FROM: CI — agent-team.el TO: Engineering Manager — Kimi-K2.6 @ kimi.ai\n%s %s : %s' \
            "${{ github.event_name }}" "${{ github.sha }}" "${{ job.status }}")
          curl -s -X POST "${{ secrets.LARK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "$MSG" '{msg_type:"text", content:{text:$t}}')"
