name: CI

# Cloud CI is the Owner's P0: it is what keeps the team alive when the local
# box goes off.  Three rules follow from that.  (1) CI must verify the same
# things we verify locally -- ert suite AND byte-compile, not one without the
# other.  (2) CI must never fail for a reason unrelated to the code: every
# network-facing step is guarded, so a missing secret or a dead endpoint is
# reported and skipped instead of failing the run.  (3) The team must RUN
# continuously from CI (Owner order, 2026-10-20): a schedule trigger turns
# every run into a heartbeat -- green suite first, then seat-liveness probes
# against the provider keys already staged as repo secrets.
#
# Probes hit providers DIRECTLY. The GoModel gateway (ai.khalidrafi.tech) is
# this laptop wearing a public hat: it answered HTTP 530 / CF error 1033 with
# the box off (verified 2026-10-20), so no CI seat may depend on it. Its probe
# below is informational only.

on:
  push:
    branches: [ai/main]
  pull_request:
    branches: [ai/main]
  schedule:
    # Heartbeat: 01:17 / 07:17 / 13:17 / 19:17 UTC. Off the top-of-hour rush;
    # ~4 runs/day keeps a private repo far inside the free minutes tier.
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq emacs-nox

      - name: Byte-compile
        # Fails the job on a real error; warnings (free functions under -Q) are
        # informational, matching how we compile locally.
        run: |
          emacs -Q --batch -L . --eval \
            '(unless (byte-compile-file "agent-team.el") (kill-emacs 1))'

      - name: Run ert tests
        run: |
          emacs -Q --batch -L . -L tests -l tests/agent-team-test.el \
            --eval '(ert-run-tests-batch-and-exit "agent-team")'

      - name: Notify Lark (webhook)
        if: always()
        env:
          # Secrets go through env, never inline into the shell text: an
          # interpolated secret on a command line is both a quoting hazard and
          # visible in the process list of the runner.
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
        run: |
          if [ -z "$LARK_WEBHOOK_URL" ]; then
            echo "::notice::LARK_WEBHOOK_URL not set - skipping Lark notify"
            exit 0
          fi
          MSG=$(printf 'CI %s %s@%s: %s · https://github.com/%s/actions/runs/%s' \
                "$EVENT" "$REF" "${SHA:0:7}" "$RESULT" \
                "${{ github.repository }}" "$RUN")
          jq -n --arg t "$MSG" '{msg_type:"text",content:{text:$t}}' \
            | curl -sS -f -X POST "$LARK_WEBHOOK_URL" \
                -H 'Content-Type: application/json' \
                --data-binary @-

  # Seat-liveness heartbeat (hiring/01 re-hire: CI-shifted roster). One real
  # completion per accountable API seat, direct to the provider. Results land
  # in the run summary; NOTHING here can fail the workflow -- a dead seat is
  # an operational fact to read in the summary, never a red run.
  probe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Probe accountable seats (direct provider keys)
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "## Seat probe — ${GITHUB_SHA::7} (${{ github.event_name }})" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "| seat brain | probe | HTTP | evidence (first 120 chars) |" >> "$SUMMARY"
          echo "|---|---|---|---|" >> "$SUMMARY"

          probe() {
            local name="$1" url="$2" model="$3" key="$4" extra="${5:-}"
            if [ -z "$key" ]; then
              echo "| $name | SKIP | - | key not set in repo secrets |" >> "$SUMMARY"
              return 0
            fi
            local body code
            body=$(mktemp)
            code=$(curl -sS -m 45 -o "$body" -w '%{http_code}' -X POST "$url" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $key" $extra \
              -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the single word: alive\"}],\"max_tokens\":16}" \
              || echo 000)
            local snippet
            snippet=$(head -c 120 "$body" | tr '\n' ' ' | tr -d '|')
            echo "| $name | $url | $code | \`$snippet\` |" >> "$SUMMARY"
            rm -f "$body"
            sleep 2   # space calls: bursts stress shared free tiers
          }

          # Software Engineer + Release Engineer — groq/qwen3.8-27b (Apache-2.0,
          # published caps 30 RPM / 200K tok/day)
          probe "groq/qwen3.8-27b" \
            "https://api.groq.com/openai/v1/chat/completions" \
            "qwen/qwen3.8-27b" "$GROQ_API_KEY"

          # Principal Engineer — openrouter/poolside/laguna-s-2.1:free (OpenMDW-1.1)
          probe "openrouter/poolside/laguna-s-2.1:free" \
            "https://openrouter.ai/api/v1/chat/completions" \
            "poolside/laguna-s-2.1:free" "$OPENROUTER_API_KEY"

          # QA fallback lane — openrouter/nvidia/nemotron-3.5-lightning:free
          probe "openrouter/nvidia/nemotron-3.5-lightning:free" \
            "https://openrouter.ai/api/v1/chat/completions" \
            "nvidia/nemotron-3.5-lightning:free" "$OPENROUTER_API_KEY"

          # QA Engineer — zai/glm-4.7-flash (MIT, free API tier)
          probe "zai/glm-4.7-flash" \
            "https://api.z.ai/api/paas/v4/chat/completions" \
            "glm-4.7-flash" "$ZAI_API_KEY"

          # INFORMATIONAL ONLY: the Owner's gateway (tunnel). Expected down
          # (530) whenever the box is off. Never a seat dependency.
          probe "gateway/glm-4.7-flash (informational)" \
            "https://ai.khalidrafi.tech/v1/chat/completions" \
            "glm-4.7-flash" "$GOMODEL_MASTER_KEY"

          echo "" >> "$SUMMARY"
          echo "Law: a probe row is evidence of the RUNTIME, not of quality —" >> "$SUMMARY"
          echo "seat ranks live in agent-team/AGENT-TEAM-MEMBERS.org." >> "$SUMMARY"

      - name: Notify Lark (webhook)
        if: always()
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          if [ -z "$LARK_WEBHOOK_URL" ]; then
            echo "::notice::LARK_WEBHOOK_URL not set - skipping Lark notify"
            exit 0
          fi
          MSG=$(printf 'Heartbeat %s @%s: seat probe done · https://github.com/%s/actions/runs/%s' \
                "$EVENT" "${SHA:0:7}" "${{ github.repository }}" "$RUN")
          jq -n --arg t "$MSG" '{msg_type:"text",content:{text:$t}}' \
            | curl -sS -f -X POST "$LARK_WEBHOOK_URL" \
                -H 'Content-Type: application/json' \
                --data-binary @-
