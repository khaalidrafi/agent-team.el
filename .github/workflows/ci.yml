name: CI

on:
  push:
    branches: [ai/main]
  pull_request:
    branches: [ai/main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq emacs-nox
      - name: Run ert tests
        run: |
          emacs -Q --batch -L . -L tests -l tests/agent-team-test.el \
            --eval '(ert-run-tests-batch-and-exit "agent-team")'
      - name: Notify Lark (switchboard)
        if: always()
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
        run: |
          T=$(curl -s -X POST https://open.larksuite.com/open-apis/auth/v3/tenant_access_token/internal \
              -H "Content-Type: application/json" \
              -d "{\"app_id\":\"$LARK_APP_ID\",\"app_secret\":\"$LARK_APP_SECRET\"}" | jq -r .tenant_access_token)
          curl -s -X POST "https://open.larksuite.com/open-apis/im/v1/messages?receive_id_type=chat_id" \
            -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d "{\"receive_id\":\"$LARK_CHAT_ID\",\"msg_type\":\"text\",\"content\":\"{\\\"text\\\":\\\"FROM: CI — agent-team.el TO: Engineering Manager — Kimi-K2.6 @ kimi.ai\\n${{ github.event_name }} ${{ github.sha }} : ${{ job.status }}\\\"}\"}"
