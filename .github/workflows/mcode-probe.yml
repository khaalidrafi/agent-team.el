name: Mcode Token Probe

# Answers: is the EXISTING sealed MCODE_AUTH_JSON still alive?
# Shape-agnostic: walks the credential JSON (records/nested), finds token
# fields wherever they live, checks expiry, refreshes via the MiniMax OAuth
# endpoint if stale, re-seals the fresh credential to the team repos.
# Verdicts + key-path names only — no token material in logs.

on:
  workflow_dispatch:

concurrency:
  group: mcode-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Seed + probe + refresh-if-stale + re-seal
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MCODE_AUTH_JSON: ${{ secrets.MCODE_AUTH_JSON }}
        run: |
          python3 -m pip install --quiet pynacl
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.parse
          from nacl import encoding, public

          cred = json.loads(os.environ["MCODE_AUTH_JSON"])

          def walk(obj, path=()):
              """Yield (path, key, value) for every dict field."""
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      yield path + (k,), k, v
                      yield from walk(v, path + (k,))
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      yield from walk(v, path + (f"[{i}]",))

          def find(names):
              for p, k, v in walk(cred):
                  if k in names and isinstance(v, str) and v:
                      return p, v
              return None, None

          def find_num(names):
              for p, k, v in walk(cred):
                  if k in names and isinstance(v, (int, float)):
                      return p, v
              return None, None

          # structure dump — names/paths only, never values
          def dump(o, ind=0):
              if isinstance(o, dict):
                  for k, v in o.items():
                      t = type(v).__name__
                      print("  " * ind + f"{k} ({t})")
                      if isinstance(v, (dict, list)) and ind < 4:
                          dump(v, ind + 1)
              elif isinstance(o, list):
                  for i, v in enumerate(o[:3]):
                      print("  " * ind + f"[{i}] ({type(v).__name__})")
                      if isinstance(v, (dict, list)) and ind < 4:
                          dump(v, ind + 1)

          dump(cred)
          at_p, at = find({"accessToken", "access_token", "token", "id_token"})
          rt_p, rt = find({"refreshToken", "refresh_token"})
          exp_p, exp = find_num({"expiresAtMs", "expires_at_ms", "expiresAt", "expires_in_ts"})
          now = int(time.time() * 1000)
          print(f"access-token path: {'.'.join(map(str, at_p)) if at_p else None} present={bool(at)}")
          print(f"refresh-token path: {'.'.join(map(str, rt_p)) if rt_p else None} present={bool(rt)}")
          print(f"expiry path: {'.'.join(map(str, exp_p)) if exp_p else None} value={exp} now={now} delta_min={(exp-now)//60000 if exp else 'n/a'}")

          def set_at_path(p, val):
              node = cred
              for part in p[:-1]:
                  node = node[int(part[1:-1])] if part.startswith("[") else node[part]
              last = p[-1]
              if last.startswith("["):
                  node[int(last[1:-1])] = val
              else:
                  node[last] = val

          def seal_all(val):
              pat = os.environ["GH_PAT"]
              def api(method, url, payload=None):
                  req = urllib.request.Request(url, method=method,
                      data=json.dumps(payload).encode() if payload is not None else None)
                  req.add_header("Authorization", f"Bearer {pat}")
                  req.add_header("Accept", "application/vnd.github+json")
                  if payload is not None:
                      req.add_header("Content-Type", "application/json")
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read().decode()
                      return json.loads(body) if body else None
              for repo in ("khaalidrafi/docneural", "khaalidrafi/admincraft",
                           "khaalidrafi/agent-team.el"):
                  pk = api("GET", f"https://api.github.com/repos/{repo}/actions/secrets/public-key")
                  box = public.SealedBox(public.PublicKey(pk["key"].encode(), encoding.Base64Encoder()))
                  enc = box.encrypt(val.encode())
                  api("PUT", f"https://api.github.com/repos/{repo}/actions/secrets/MCODE_AUTH_JSON",
                      {"encrypted_value": base64.b64encode(enc).decode(), "key_id": pk["key_id"]})
                  print(f"RESEALED MCODE_AUTH_JSON -> {repo}")

          if at and exp and exp > now + 120000:
              print("VERDICT: ALIVE — access token still valid; no re-auth needed")
          elif rt:
              data = urllib.parse.urlencode({
                  "grant_type": "refresh_token", "client_id": "mcode-public",
                  "refresh_token": rt}).encode()
              req = urllib.request.Request("https://account.minimax.io/oauth2/token",
                                           data=data, method="POST")
              req.add_header("Content-Type", "application/x-www-form-urlencoded")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      tok = json.loads(r.read().decode())
                  nat = tok.get("access_token")
                  if not nat:
                      print(f"VERDICT: DEAD — refresh rejected: {tok.get('error', 'unknown')}")
                  else:
                      if at_p: set_at_path(at_p, nat)
                      if tok.get("expires_in"):
                          e = int(time.time()*1000) + int(tok["expires_in"])*1000
                          if exp_p: set_at_path(exp_p, e)
                      if tok.get("refresh_token") and rt_p:
                          set_at_path(rt_p, tok["refresh_token"])
                      seal_all(json.dumps(cred))
                      print("VERDICT: REFRESHED+RESEALED — existing session lived; no device click needed")
              except urllib.error.HTTPError as e:
                  print(f"VERDICT: DEAD — refresh HTTP {e.code}; device re-auth needed")
          else:
              print("VERDICT: DEAD — no refresh token found; device re-auth needed")
          PY
