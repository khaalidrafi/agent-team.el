name: Secret Sync

# Owner standing order (2026-10-24): "Always provide ALL repo secrets" —
# every team repo holds the FULL set. Secret VALUES are write-only and live
# here, so this workflow runs WHERE THE VALUES ALREADY EXIST (this repo's
# env) and re-seals them into the target repos' Actions APIs with GH_PAT
# (which holds secrets:write on the targets). Values only ever exist as
# runner env; logs carry names and counts, never values — SECRET LAW holds.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'comma-separated target repos (full names)'
        required: false
        default: 'khaalidrafi/docneural,khaalidrafi/admincraft'

concurrency:
  group: secret-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Seal + push the full set to targets
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CODEBUDDY_AUTH_TOKEN: ${{ secrets.CODEBUDDY_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMI_API_KEY: ${{ secrets.GMI_API_KEY }}
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MCODE_AUTH_JSON: ${{ secrets.MCODE_AUTH_JSON }}
          NAVYAI_API_KEY: ${{ secrets.NAVYAI_API_KEY }}
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          TOKENHARBOR_API_KEY: ${{ secrets.TOKENHARBOR_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          XPLABS_API_KEY: ${{ secrets.XPLABS_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          python3 -m pip install --quiet pynacl
          python3 .github/scripts/sync_secrets.py \
            "${{ inputs.targets || 'khaalidrafi/docneural,khaalidrafi/admincraft' }}"
