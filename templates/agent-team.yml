name: Agent Team Chain

# {{PROJECT}} — CI agent-team chain, scaffolded by agent-team.el
# (M-x agent-team-setup-project) from templates/agent-team.yml.
# One canonical architecture, proven on khaalidrafi/agent-team.el and
# khaalidrafi/admincraft (Owner orders 2026-10-20 -> 2026-10-21).
#
# Structure per run: test (landing gate) -> probe (seat liveness, never
# gates) -> turn (session restore -> ONE agent
# segment in the preinstalled harness container -> session scrub+upload ->
# branch push + rotation advance) -> finalize (auto-merge behind the gate
# -> pause-after-TODO review -> Jev judgment -> stall accounting ->
# SELF-DISPATCH while the objective is open and KILL-SWITCH is OFF). The
# team decides how many runs the objective takes; the chain stops ONLY on
# kill switch, objective complete, tests red, or the CHAIN-PAUSE arm; a
# no-progress streak shifts to backoff, never to failure. Admincraft
# laws backported 2026-10-22 (khaalidrafi/agent-team.el
# agent-team/ADMINCRAFT-LESSONS.org): an unknown rotation pointer REFUSES
# (BLOCKED) instead of silently running a wrong lane; a lane exiting 0
# with ZERO commits is not progress; PAUSE-AFTER-TODO DEFAULTS ON — a
# clean halt after a :DELIVERED: TODO (mode=paused, the Lead clears
# #+CHAIN-PAUSE to resume); an explicit Owner order may set OFF for a
# continuous multi-TODO run; fallback chains
# name the lane that ACTUALLY ran and never fake a paid visit. NO chat
# mirror: Telegram retired (Owner 2026-10-25 #hq), Discord retired too
# (Owner 2026-10-26 #hq: "remv discord, too."). The team chat lives in
# agent-team/TEAM-CHAT.org on the repo; the Lead couriers Owner-bound
# entries to #hq by hand. GoModel (llmfisher gateway) rides as
# a HEALTH-GATED lane (turn health + finalize Jev). The gateway URL is
# RESOLVED per job (Owner order 2026-10-22): vars.GOMODEL_GATEWAY_URL
# override -> https://ai.khalidrafi.tech -> localhost:8080 -> in-runner
# boot (last resort = no deployment active). DOWN -> lane-fallback law,
# never red. Judgment lane is BINARY: Jev via the gateway when it is up,
# else the chain decides directly (local rules) — no provider chain.
#
# TASK BRANCHES (Owner order 2026-10-25 #hq — "run multiple CI with
# different branches, where branches will represent a task assigned to a
# team member. Update templates, too"): every branch
# ai/task/<member-slug>-<task-slug> runs its OWN chain (the concurrency
# group is per-ref) on a THIN branch = trunk tip + ONE control commit
# holding the task's own fork of agent-team/TEAM-CONTROL.org with
# #+TASK-ID: + #+ASSIGNEE: and #+TURN: pinned to the assignee. Each
# segment: sync the branch to a fresh trunk tip keeping the task control
# (force push), cut the work branch, seat works, and the work lands on
# ai/main through the EXISTING landing gate — the trunk control file
# NEVER crosses between branches, so parallel tasks cannot stomp the
# team control. Rotation pointer / stall / mirror markers write to the
# task branch (state lives in the file; history disposable). Sessions
# are namespaced per task: sessions-<task-slug>-<seat>-<run>. No Telegram bridge or mirror exists anywhere (retired 2026-10-25:
# no Telegram communication). Arm a task: cut the branch from
# ai/main, fork the control file with the task keys, dispatch the
# workflow on that branch (Actions UI branch picker or `gh workflow run
# agent-team.yml --ref <branch>`) — the chain self-dispatches while the
# task objective is OPEN. The ai/main chain behaves exactly as before.

# This file is LEAD-OWNED: seats never edit it (brief law #10). Re-scaffold
# it with M-x agent-team-setup-project (refresh = re-run, adoption is
# asked). Slot tokens are filled by the setup command; the blocks already
# inside are the engine's proven defaults.

on:
  push:
    branches: [ai/main]
  schedule:
    # Chain safety net — the self-dispatching finalize owns the pacing;
    # this cron only re-kicks a chain that died infra-level.
    - cron: '{{CRON}}'
  workflow_dispatch: {}

concurrency:
  group: chain-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # self-chain: finalize re-dispatches the next turn
  # NO `workflows: write` — GitHub rejects the KEY at workflow-creation
  # time: every run startup-FAILS with zero jobs (agent-team.el runs
  # 39455051426 / 39455277702 evidence). Seats therefore NEVER touch
  # .github/workflows/* (brief law #10: Lead-owned files, cite in chat).

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
{{GATE_SETUP}}
      - name: Landing gate ({{GATE_NAME}})
        run: |
{{GATE_CMD}}

  # Seat-liveness heartbeat (engine shape). One real completion per
  # accountable API seat, direct to the provider. Results land in the run
  # summary; NOTHING here can fail the workflow. The gomodel/Jev lane is
  # health-gated in `turn` + `finalize`; seats go DIRECT to providers here.
  # The Lead may re-point rows at this team's MEMBERS.org after hiring.
  probe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Probe accountable seats (direct provider keys)
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "## Seat probe — ${GITHUB_SHA::7} (${{ github.event_name }})" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "| seat brain | probe | HTTP | evidence (first 120 chars) |" >> "$SUMMARY"
          echo "|---|---|---|---|" >> "$SUMMARY"

          probe() {
            local name="$1" url="$2" model="$3" key="$4" extra="${5:-}"
            if [ -z "$key" ]; then
              echo "| $name | SKIP | - | key not set in repo secrets |" >> "$SUMMARY"
              return 0
            fi
            local body code
            body=$(mktemp)
            code=$(curl -sS -m 45 -o "$body" -w '%{http_code}' -X POST "$url" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $key" $extra \
              -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the single word: alive\"}],\"max_tokens\":16}" \
              || echo 000)
            local snippet
            snippet=$(head -c 120 "$body" | tr '\n' ' ' | tr -d '|')
            echo "| $name | $url | $code | \`$snippet\` |" >> "$SUMMARY"
            rm -f "$body"
            sleep 2   # space calls: bursts stress shared free tiers
          }

          probe "openrouter/poolside/laguna-s-2.1:free" \
            "https://openrouter.ai/api/v1/chat/completions" \
            "poolside/laguna-s-2.1:free" "$OPENROUTER_API_KEY"

          probe "groq/qwen3.8-27b" \
            "https://api.groq.com/openai/v1/chat/completions" \
            "qwen/qwen3.8-27b" "$GROQ_API_KEY"

          probe "zai/glm-4.7-flash" \
            "https://api.z.ai/api/paas/v4/chat/completions" \
            "glm-4.7-flash" "$ZAI_API_KEY"

          # minimax-m3.1 probe row REMOVED — BURN-LAW (Owner 2026-10-24 17:01Z)

          echo "" >> "$SUMMARY"
          echo "Law: a probe row is evidence of the RUNTIME, not of quality —" >> "$SUMMARY"
          echo "seat ranks live in agent-team/MEMBERS.org." >> "$SUMMARY"

  # ONE TURN OF WORK. Reads agent-team/TEAM-CONTROL.org:
  #   #+KILL-SWITCH: ON           -> stop everything, exit green.
  #   #+OBJECTIVE-STATE: COMPLETE -> objective closed, exit green.
  #   #+CHAIN-PAUSE: ON           -> paused-todo-review: halt cleanly, no
  #                                  burn (admincraft pause law); the Lead
  #                                  clears the marker to resume.
  #   #+OBJECTIVE: empty          -> no work defined; gate stays green, skip.
  #   otherwise                   -> run the on-turn member's REAL agent
  #                                  (preinstalled in the harness container)
  #                                  for one segment toward the objective,
  #                                  advance the rotation, commit.
  turn:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [test, probe]
    outputs:
      turn_branch: ${{ steps.push.outputs.branch }}
      seg_result: ${{ steps.seg.outputs.result }}
      base_sha: ${{ steps.control.outputs.base_sha }} # chain ref tip before this segment — the chat-mirror diff base
      commits: ${{ steps.push.outputs.commits }}      # post-turn commit count — EMPTY-SEGMENT law signal
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    env:
{{SEAT_ENV}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read control file (kill switch / objective / turn)
        id: control
        run: |
          CTL=agent-team/TEAM-CONTROL.org
          KILL=$(grep -oP '^\#\+KILL-SWITCH:\s*\K\w+' "$CTL" | head -1 || true)
          OBJSTATE=$(grep -oP '^\#\+OBJECTIVE-STATE:\s*\K\w+' "$CTL" | head -1 || true)
          OBJECTIVE=$(grep -oP '^\#\+OBJECTIVE:\s*\K.*' "$CTL" | head -1 || true)
          TURN=$(grep -oP '^\#\+TURN:\s*\K.*' "$CTL" | head -1 | xargs)
          echo "kill=${KILL:-OFF} objstate=${OBJSTATE:-OPEN} turn='${TURN}'"
          # R-2-69 TASK-BRANCH LAW: every ai/task/** ref runs its OWN chain
          # off ITS OWN agent-team/TEAM-CONTROL.org (thin branch: trunk tip
          # + task control). CHAIN_REF replaces every hardcoded branch from
          # here down; ai/main keeps the legacy single-team behavior.
          REF="${{ github.ref_name }}"
          case "$REF" in
            ai/main|ai/task/*) : ;;
            *) REF="ai/main"
               echo "::warning::chain dispatched on non-team ref '${{ github.ref_name }}' — pinned to ai/main semantics" ;;
          esac
          echo "CHAIN_REF=$REF" >> "$GITHUB_ENV"
          REF_SLUG=$(printf '%s' "$REF" | sed 's#^ai/##; s#/#-#g')
          echo "REF_SLUG=$REF_SLUG" >> "$GITHUB_ENV"
          TASK_ID=$(grep -oP '^\#\+TASK-ID:\s*\K.*' "$CTL" | head -1 | xargs || true)
          ASSIGNEE=$(grep -oP '^\#\+ASSIGNEE:\s*\K.*' "$CTL" | head -1 | xargs || true)
          echo "TASK_ID=${TASK_ID:-none}" >> "$GITHUB_ENV"
          echo "ASSIGNEE=${ASSIGNEE:-none}" >> "$GITHUB_ENV"
          if [ "$REF" = "ai/main" ]; then SESS_PREFIX="sessions-"; else SESS_PREFIX="sessions-${REF_SLUG}-"; fi
          echo "sess_prefix=$SESS_PREFIX" >> "$GITHUB_OUTPUT"
          echo "chain ref: $REF (slug $REF_SLUG) task=${TASK_ID:-none} assignee=${ASSIGNEE:-none}"
          # Pre-segment ai/main tip: base for diffing TEAM-CHAT.org to
          # post-merge HEAD — THIS segment's new GLM chats (no chat mirror
          # since 2026-10-26; the Lead reads them in the repo and couriers).
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # GIT HYGIENE (admincraft 3d): a stale LOCAL ref named like a
          # remote-tracking ref ("origin/ai/main" as a local branch) makes
          # git log origin/ai/main AMBIGUOUS and can silently show a dead
          # history. Warn loudly; scripts use explicit refs/remotes/.
          for SHADOW in $(git for-each-ref --format='%(refname:short)' refs/heads/ \
              | grep '^origin/' || true); do
            echo "::warning::local branch '$SHADOW' shadows a remote-tracking ref — delete it (git branch -D '$SHADOW') before trusting git log $SHADOW"
          done
          if [ "${KILL:-OFF}" = "ON" ]; then
            echo "mode=killed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${OBJSTATE:-OPEN}" = "COMPLETE" ]; then
            echo "mode=complete" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Placeholder objective = nothing specified by the Owner yet.
          if [ -z "$OBJECTIVE" ] || echo "$OBJECTIVE" | grep -q "the Owner writes"; then
            echo "mode=no-objective" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PAUSE-AFTER-TODO law (admincraft, Owner-invented): while the
          # pause is armed the chain halts CLEANLY after a delivered TODO —
          # no segment runs, nothing burns, the Lead reviews and clears
          # #+CHAIN-PAUSE to resume. Green, not failed.
          PAUSE=$(grep -oP '^\#\+CHAIN-PAUSE:\s*\K\w+' "$CTL" | head -1 || true)
          if [ "${PAUSE:-OFF}" = "ON" ]; then
            echo "mode=paused" >> "$GITHUB_OUTPUT"
            echo "chain PAUSED (#+CHAIN-PAUSE: ON) — Lead reviews the delivered TODO, clears the marker to resume" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "mode=work" >> "$GITHUB_OUTPUT"
          echo "objective=$OBJECTIVE" >> "$GITHUB_OUTPUT"
          # Seat pointer -> seat id. The case grammar is extensible: one
          # line per rotation entry ("model@body ... role" pointer forms).
          case "$TURN" in
{{ROTATION_CASE}}
          esac
          echo "seat=$NEXT_SEAT" >> "$GITHUB_OUTPUT"

      - name: Stop notice (kill switch / complete / no objective)
        if: steps.control.outputs.mode != 'work'
        run: |
          MODE="${{ steps.control.outputs.mode }}"
          SUMMARY="$GITHUB_STEP_SUMMARY"
          case "$MODE" in
            killed)       MSG="TEAM STOPPED BY KILL SWITCH — no turns run until #+KILL-SWITCH: OFF" ;;
            complete)     MSG="OBJECTIVE COMPLETE — team standing down (set #+OBJECTIVE-STATE: OPEN with a new objective to restart)" ;;
            no-objective) MSG="NO OBJECTIVE SET — write one line into #+OBJECTIVE in agent-team/TEAM-CONTROL.org; rotation idle until then" ;;
          esac
          echo "$MSG" >> "$SUMMARY"

      # R-2-69 TASK-BRANCH SYNC: a task branch is THIN — trunk tip plus
      # exactly one control commit (the task's own TEAM-CONTROL.org fork).
      # Every segment starts from a FRESH base: absorb origin/ai/main (peer
      # mesh + landed work), keep the task control, force-push. The per-ref
      # concurrency group serializes this chain; the seat's WORK travels
      # via the work branch -> trunk landing, never through this branch.
      - name: Sync task branch with the trunk (fresh base, task control kept)
        if: steps.control.outputs.mode == 'work' && env.CHAIN_REF != 'ai/main'
        run: |
          set -u
          git config user.name "agent-team-ci"
          git config user.email "agent-team-ci@users.noreply.github.com"
          git remote set-url --push origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          SYNCED=no
          for i in 1 2 3; do
            git fetch origin +refs/heads/ai/main:refs/remotes/origin/ai/main || true
            git fetch origin +refs/heads/"$CHAIN_REF":refs/remotes/origin/"$CHAIN_REF" || true
            if ! git show "origin/${CHAIN_REF}:agent-team/TEAM-CONTROL.org" > /tmp/.task-ctl.org 2>/dev/null; then
              echo "::warning::no task control on ${CHAIN_REF} — branch not armed; skipping sync"
              break
            fi
            git reset --hard origin/ai/main
            cp /tmp/.task-ctl.org agent-team/TEAM-CONTROL.org
            if git diff --quiet -- agent-team/TEAM-CONTROL.org; then
              SYNCED=uptodate; break
            fi
            git add agent-team/TEAM-CONTROL.org
            git commit -m "ci-sync: ${CHAIN_REF} = trunk tip + task control (fresh segment base)"
            if git push --force origin "$CHAIN_REF"; then SYNCED=yes; break; fi
            sleep 10
          done
          echo "task sync: ${SYNCED} (${CHAIN_REF} = trunk tip + task control)" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Resolve gateway (override -> deployment -> local -> boot — Owner order 2026-10-22)
        if: steps.control.outputs.mode == 'work'
        env:
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}
          GOMODEL_GATEWAY_OVERRIDE: ${{ vars.GOMODEL_GATEWAY_URL }}
        run: |
          set -u
          # Owner resolution law (2026-10-22): 1) vars.GOMODEL_GATEWAY_URL
          # override wins when set; 2) https://ai.khalidrafi.tech — the
          # deployment; 3) http://localhost:8080 — an already-running
          # listener; 4) ONLY when nothing answers does the next step boot
          # gomodel inside the runner (nothing answers == no deployment is
          # active right now). Every tier uses the ping contract
          # (agent-team-gateway-ping): GET / -> 404/200 = UP, else down.
          # The judgment lane is BINARY and rides no provider chain: Jev
          # via the resolved gateway when it is up, else the chain decides
          # directly (local rules) — never red.
          SUMMARY="$GITHUB_STEP_SUMMARY"
          ping() {
            curl -s -o /dev/null -m 20 -w '%{http_code}' \
              -H "Authorization: Bearer ${GOMODEL_MASTER_KEY:-}" "$1/" || echo 000
          }
          if [ -n "${GOMODEL_GATEWAY_OVERRIDE:-}" ]; then
            echo "GOMODEL_GATEWAY_URL=${GOMODEL_GATEWAY_OVERRIDE}" >> "$GITHUB_ENV"
            echo "GOMODEL_BOOT=skip" >> "$GITHUB_ENV"
            echo "gateway: vars.GOMODEL_GATEWAY_URL override in force (${GOMODEL_GATEWAY_OVERRIDE}) — health step still gates it" >> "$SUMMARY"
            exit 0
          fi
          CODE=$(ping "https://ai.khalidrafi.tech")
          if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
            echo "GOMODEL_GATEWAY_URL=https://ai.khalidrafi.tech" >> "$GITHUB_ENV"
            echo "GOMODEL_BOOT=skip" >> "$GITHUB_ENV"
            echo "gateway: deployment UP at ai.khalidrafi.tech (HTTP $CODE) — in-runner boot skipped" >> "$SUMMARY"
            exit 0
          fi
          REMOTE_CODE="$CODE"
          CODE=$(ping "http://localhost:8080")
          if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
            echo "GOMODEL_GATEWAY_URL=http://localhost:8080" >> "$GITHUB_ENV"
            echo "GOMODEL_BOOT=skip" >> "$GITHUB_ENV"
            echo "gateway: local listener UP at localhost:8080 (HTTP $CODE) — in-runner boot skipped" >> "$SUMMARY"
            exit 0
          fi
          echo "GOMODEL_GATEWAY_URL=http://localhost:8080" >> "$GITHUB_ENV"
          echo "GOMODEL_BOOT=boot" >> "$GITHUB_ENV"
          echo "gateway: nothing answers (ai.khalidrafi.tech HTTP ${REMOTE_CODE}, localhost:8080 HTTP ${CODE}) — next step boots gomodel in-runner (last resort)" >> "$SUMMARY"
          exit 0

      - name: GoModel gateway up (inside the runner — Owner order 2026-10-22)
        if: steps.control.outputs.mode == 'work' && env.GOMODEL_BOOT != 'skip'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -u
          if [ -z "${GH_PAT:-}" ]; then
            echo "::warning::GH_PAT missing — cannot clone khaalidrafi/llmfisher for the gateway config; gomodel lane stays DOWN -> fallback (never red)"
            exit 0
          fi
          rm -rf /tmp/llmfisher-src
          git clone --quiet --depth 1 \
            "https://x-access-token:${GH_PAT}@github.com/khaalidrafi/llmfisher" \
            /tmp/llmfisher-src
          docker rm -f gomodel >/dev/null 2>&1 || true
          # Tuned env block = llmfisher docker-compose.yml gomodel service
          # verbatim (field types checked per the GoModel source; a wrong
          # shape is a crash loop, not a warning). Keys ride as env only
          # (env-var law): nothing baked, nothing printed, nothing in git.
          export JEV_API_KEY="${TYPESAFE_API_KEY:-}"
          docker run -d --name gomodel -p 127.0.0.1:8080:8080 \
            -v /tmp/llmfisher-src/config:/app/config:ro \
            -v gomodel_data:/app/data \
            -e SQLITE_PATH=/app/data/gomodel.db \
            -e CONFIGURED_PROVIDER_MODELS_MODE=allowlist \
            -e FAILOVER_RETRY_ON_STATUSES=4xx,5xx \
            -e FAILOVER_MAX_ATTEMPTS=5 \
            -e RETRY_MAX_RETRIES=1 \
            -e RETRY_INITIAL_BACKOFF=3s \
            -e CIRCUIT_BREAKER_SCOPE=model \
            -e HTTP_RESPONSE_HEADER_TIMEOUT=30 \
            -e CACHE_REFRESH_INTERVAL=21600 \
            -e PROVIDER_RECHECK_INTERVAL=300 \
            -e LOG_LEVEL=info \
            -e PROVIDER_PROMPT_CACHE_PLANNER_ENABLED=false \
            -e GOMODEL_DEMO_MODE=false \
            -e GOMODEL_MASTER_KEY -e JEV_API_KEY \
            enterpilot/gomodel >/dev/null
          ok=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -m 2 -w '%{http_code}' \
              -H "Authorization: Bearer ${GOMODEL_MASTER_KEY:-}" \
              "http://localhost:8080/" || echo 000)
            if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
              echo "GoModel gateway UP inside the runner (HTTP $CODE, ping contract)"
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::warning::gomodel container did not answer in 30s — lane stays DOWN -> fallback (never red)"
            docker logs --tail 20 gomodel 2>&1 \
              | sed 's/[A-Za-z0-9+/=_-]\{20,\}/[redacted]/g' || true
          fi
          exit 0

      - name: GoModel lane health (llmfisher gateway — Jev judgment layer)
        if: steps.control.outputs.mode == 'work'
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          # Owner gateway contract (agent-team.el agent-team-gateway-ping):
          # GET / answers HTTP 404 when the ORIGIN is up; 530/000 = tunnel down.
          CODE=$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
                  -H "Authorization: Bearer ${GOMODEL_MASTER_KEY}" \
                  "${GOMODEL_GATEWAY_URL}/" || echo 000)
          if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
            echo "GOMODEL_UP=true" >> "$GITHUB_ENV"
            echo "gomodel lane: UP (gateway HTTP $CODE) — Jev available to this turn and finalize" >> "$SUMMARY"
          else
            echo "GOMODEL_UP=false" >> "$GITHUB_ENV"
            echo "gomodel lane: DOWN (HTTP $CODE) — lane-fallback law active (turn proceeds on direct provider lanes; auto-reuses gomodel the moment the box answers)" >> "$SUMMARY"
          fi

      - name: Build harness image (preinstalled agents — cached, no installs)
        if: steps.control.outputs.mode == 'work'
        run: |
          docker buildx build --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f docker/harness/Dockerfile \
            -t {{HARNESS_TAG}}:local \
            .

      - name: Prepare git identity
        if: steps.control.outputs.mode == 'work'
        run: |
          git config user.name "agent-team-ci"
          git config user.email "agent-team-ci@users.noreply.github.com"
          git remote set-url --push origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      # (Telegram bridge retired — Owner order 2026-10-25 #hq: no more
      # Telegram communication. The Owner's words reach the team via
      # Discord #hq; the Lead transcribes them into the team chat.)
      - name: Restore previous session of this seat (resume context)
        id: sess-restore
        if: steps.control.outputs.mode == 'work'
        env:
          SEAT: ${{ steps.control.outputs.seat }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ART_ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            | jq -r --arg p "${{ steps.control.outputs.sess_prefix }}${SEAT}-" \
              '[.artifacts[] | select(.name | startswith($p))] | sort_by(.id) | last | .id // empty')
          [ -n "$ART_ID" ] || { echo "sessions: no previous artifact for ${SEAT} — cold start"; exit 0; }
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -o "$PWD/.sessions-prev.zip" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ART_ID}/zip"
          mkdir -p "$PWD/.sessions-restore"
          unzip -q -o "$PWD/.sessions-prev.zip" -d "$PWD/.sessions-restore" || true
          TGZ=$(ls "$PWD"/.sessions-restore/sessions-*.tgz 2>/dev/null | head -1)
          if [ -n "${TGZ:-}" ]; then
            rm -rf /tmp/sessx && mkdir -p /tmp/sessx
            tar xzf "$TGZ" -C /tmp/sessx 2>/dev/null || true
            rm -rf "$PWD/.sessions-restore" && mv /tmp/sessx "$PWD/.sessions-restore"
          fi
          rm -f "$PWD/.sessions-prev.zip"
          echo "sessions: restored artifact ${ART_ID} for seat ${SEAT}"

      - name: Run the turn (one segment, preinstalled agent in container)
        id: seg
        if: steps.control.outputs.mode == 'work'
        timeout-minutes: 22   # a hung harness fails THIS step, not the rotation
        run: |
          SEAT="${{ steps.control.outputs.seat }}"
          # Read the objective FROM THE FILE, never by template substitution:
          # an objective containing quotes/dollars/backticks must never be
          # rendered into the script by the workflow template (mesh/01 turn
          # 1-5: quoted objective text broke bash parsing -> exit 127 before
          # any agent ran).
          OBJECTIVE=$(grep -oP '^\#\+OBJECTIVE:\s*\K.*' agent-team/TEAM-CONTROL.org | head -1 || true)
          BOARD=agent-team/TODOS.org
          SUMMARY="$GITHUB_STEP_SUMMARY"
          TOP=$(grep -E {{TOP_GREP}} "$BOARD" | head -8 | sed 's/^\*\** //' || true)
          BRANCH="ai/turn-${REF_SLUG:-main}-$(date -u +%Y%m%d-%H%M%S)"   # R-2-69: ref-slug + seconds — parallel task chains never collide
          git checkout -b "$BRANCH"
          echo "TURN_BRANCH=$BRANCH" >> "$GITHUB_ENV"

          BRIEF="You are the on-turn member of the {{PROJECT}} Agent Team, seat ${SEAT}.
          TEAM OBJECTIVE (from agent-team/TEAM-CONTROL.org): ${OBJECTIVE}
          TASK BRANCH LAW (Owner order 2026-10-25 #hq): you are on branch
          ${CHAIN_REF:-ai/main} — this branch IS the task${TASK_ID:+ (task: ${TASK_ID})}${ASSIGNEE:+, assigned to ${ASSIGNEE}}.
          Work ONLY this task on this branch; tag your chat entries
          :task:${TASK_ID:-main}; peer pings across tasks still ride the
          ONE team chat (the trunk relays it every segment).
          Law: templates/COMMON.org (canonical manual, khaalidrafi/agent-team.el).
          Board: agent-team/TODOS.org. Roster: agent-team/MEMBERS.org.
          Manual: agent-team/TEAM-CONTROL.org + agent-team/TEAM.md. Repo context: {{REPO_CONTEXT}}.
          PEER MESH — ONE CHAT BUFFER (Owner orders 2026-10-20: members talk
          to each other — work, share reports, take each other's help, get
          dispatches; 16:55: team chat is ONE Org file, direct pings, no
          mailbox; 17:55 FORMAT LAW: standard Org format — the headline
          carries the FROM, fields ride Org tags + a :PROPERTIES: drawer):
          agent-team/TEAM-CHAT.org. Append one message AT EOF in this
          EXACT format:
          * MSG ${SEAT} -> @<to|all> :<kind>:      :msg:${SEAT}:<to-sans-at>:<kind>:
          :PROPERTIES:
          :FROM: ${SEAT}
          :TO: <to|all>
          :KIND: <dispatch|report|request|escalation|review|note>
          :WHEN: [YYYY-MM-DD Eee HH:MM UTC]
          :END:
          <indented body lines>
          The headline MUST carry the FROM (Owner: \"Org headings should
          contain the FROM content\"); tags + properties drawer = Org
          syntax; WHEN is an Org inactive timestamp. Never edit existing
          entries — append only. Any message meant for the Owner MUST open with
          \"FROM: <seat>\" and \"TO: @owner\" lines — the Lead reads the chat
          in the repo and pastes your message to him on #hq verbatim; write
          it in plain simple words (PLAIN LANGUAGE law, Owner 2026-10-25).
          Handles: {{HANDLES}}.
          mailbox/ is a frozen archive — NEVER write there.
          TOP BOARD ITEMS (oldest-first):
          ${TOP}
{{WORK_ORDER}}
          WORK ONE SEGMENT (time-boxed, max 3 self-attempts per MEMBER LAWS):
          1. READ THE TEAM CHAT FIRST (agent-team/TEAM-CHAT.org): scan the
             tail for @${SEAT} pings you have not answered — do the work,
             answer it, or reply BLOCKED with evidence, by appending your
             reply to the chat. Never edit or delete an existing entry;
             never touch other seats' entries.
          2. Pick your work toward the TEAM OBJECTIVE: the oldest open board
             item that serves it and matches your role, or any task a peer
             pinged to you in the chat; if none matches, do the smallest
             verifiable improvement that does (docs, tests, CI repair).
          3. Do the work IN THIS BRANCH. Small, verifiable, committed.
          4. VERIFY before finishing (the landing gate runs the same and
             finalize UNDOES the merge of a red tree — red work never lands).
          5. POST TO THE TEAM CHAT (agent-team/TEAM-CHAT.org, append at
             EOF, one headline per message, direct @pings): dispatch
             downstream work to peers, report upstream results with
             evidence (file:line, commit sha), and send :request: /
             :escalation: @lead after 2 failed self-attempts. Taking a
             peer's help IS encouraged — ping them directly.
          6. Append a :LOGBOOK: note to the board item you touched: what
             changed + evidence (file:line, commit sha). Never mark DONE
             (that is the Lead's gate).
          7. Commit everything on this branch with message 'turn(${SEAT}): ...'.
          8. REPORT: append your report to agent-team/TEAM-CHAT.org as
             '${SEAT} -> @lead :report:' (RESULT: DONE | PARTIAL | BLOCKED,
             evidence included). Real runs ALSO post it to YOUR role's Lark
             custom-bot webhook in env ROLE_LARK_WEBHOOK
             (JSON {\"msg_type\":\"text\",\"content\":{\"text\":\"REPORT — <task-id>: <title>\\nFROM: <role> — <model@agent>\\nRESULT: DONE | PARTIAL | BLOCKED\\nEVIDENCE: <file:line / commit sha>\\nNEXT: <what remains>\"}})
             only if it is non-empty; if empty, skip silently and note it
             in the board LOGBOOK. Never put credentials in any message.
          9. Never claim the OBJECTIVE complete yourself: a completion claim
             goes to the chat as '${SEAT} -> @lead :report:'; the Lead
             verifies against the objective and only the Lead sets
             OBJECTIVE-STATE: COMPLETE.
          10. Do NOT push to ai/main or your task branch; the CI self-chain
              auto-merges your
              branch right after the segment (your chat posts must
              propagate).
          11. LEAD-OWNED FILES — never edit, only read and cite:
              .github/workflows/*, agent-team/TEAM-CONTROL.org,
              .gitattributes, .github/scripts/*. Verify plumbing facts with
              file:line evidence in your mail/report instead. (Editing them
              breaks the chain's git permissions and the rotation pointer.)
          Boundaries: no spend; no destructive actions; stay in scope of
          the item you picked.
          SECRET LAW (Owner order 2026-10-21 18:27Z #hq): credentials
          NEVER travel in chat, files, commits, or messages — they live
          in ENV VARS (repo secrets -> process env, e.g.
          QODER_PERSONAL_ACCESS_TOKEN). If you need a credential a peer
          holds, ask for its ENV VAR NAME; the peer replies with the NAME
          and a has-it confirmation, NEVER the value; you read it from
          your OWN environment. Never echo a secret value anywhere. The
          SECRET GUARD (.github/scripts/secret-guard.sh) redacts leaked
          values from every commit, chat entry, and session artifact
          before they reach git history.
          SESSION LAW (same Owner order — session files matter): your CLI
          session files are collected at the end of the turn, SCRUBBED of
          secrets, and uploaded as artifact 'sessions-<seat>-<run>'
          (30-day retention). The next turn of YOUR seat restores them
          before you run — resume your context (qoder / goose / opencode /
          codebuddy session files) instead of starting cold."

          # Seat -> body command. Brains come from the baked configs; keys
          # come from repo secrets via env. The harness image has the
          # bodies preinstalled (Owner order: containers, not CI installs).
          # The script lives IN the workspace so the container reads it via
          # the mount; the verdict is written back as .turn-result.txt —
          # NO shell pipelines anywhere (CI runs bash -o pipefail: a grep
          # with no match would silently kill the step — demo/01 turn 5).
          cat > "$PWD/.turn-inside.sh" <<'INNER'
          #!/usr/bin/env bash
          set +e
          # SESSION RESTORE (Owner order 18:27Z: session files are
          # important — resume with context): the host mounted the seat's
          # previous SCRUBBED session tree at /sessions-restore; drop it
          # into $HOME before anything runs.
          if [ -d /sessions-restore ]; then
            mkdir -p "$HOME"
            if [ -d /sessions-restore/home/agent ]; then
              cp -a /sessions-restore/home/agent/. "$HOME/" 2>/dev/null || true
            else
              cp -a /sessions-restore/. "$HOME/" 2>/dev/null || true
            fi
          fi
{{SEGMENT_PRE}}
          case "$SEAT" in
{{SEGMENT_RUNNER}}
            *)
              echo "TURN_RESULT=BLOCKED (unknown seat ${SEAT} — rotation case gap)"
              ;;
          esac
          # SESSION COLLECT (Owner order 18:27Z): persist THIS turn's CLI
          # session files — the container is --rm, they die here unless
          # captured. Scrubbing happens on the host before upload.
          SESS="/workspace/.turn-sessions.tgz"
          rm -f "$SESS"
          tar czf "$SESS" -C / \
            "${HOME#/}/.qoder" \
            "${HOME#/}/.config/goose/sessions" \
            "${HOME#/}/.local/share/opencode" \
            "${HOME#/}/.codebuddy/projects" \
            "${HOME#/}/.codebuddy/sessions" \
            "usr/local/lib/qoder-home/.qoder" \
            2>/dev/null || true
          [ -s "$SESS" ] || echo "sessions: nothing collected this turn" >&2
          INNER

          # SEAT/BRIEF are shell assignments, NOT exported env vars —
          # `docker run -e NAME` (bare) reads the CLI process env and passed
          # EMPTY strings into the container (smoke test 14:18: SEAT=[]), so
          # the inner case matched nothing and exited silently. Pass values
          # explicitly instead.
          mkdir -p "$PWD/.sessions-restore"
          if docker run --rm --user 1001:1001 \
            -v "$PWD":/workspace -w /workspace \
            -v "$PWD/.sessions-restore":/sessions-restore:ro \
            -e SEAT="${SEAT}" -e BRIEF="${BRIEF}" \
            {{DOCKER_RUN_ENV}} \
            {{HARNESS_TAG}}:local bash /workspace/.turn-inside.sh \
            > /tmp/.turn-out.txt 2>&1; then
            echo "container verdict captured"
          else
            echo "docker run failed — see output below for the cause"
            tail -30 /tmp/.turn-out.txt || true
            echo "TURN_RESULT=BLOCKED (docker run failed — see log)" > "$PWD/.turn-result.txt"
          fi
          sed -n '/TURN_RESULT=/p' /tmp/.turn-out.txt > /tmp/.turn-result.tmp || true
          if [ -s /tmp/.turn-result.tmp ]; then
            cp /tmp/.turn-result.tmp "$PWD/.turn-result.txt"
          fi
          [ -s "$PWD/.turn-result.txt" ] || echo "TURN_RESULT=BLOCKED (container wrote no verdict — see log)" > "$PWD/.turn-result.txt"
          cat "$PWD/.turn-result.txt" >> "$GITHUB_ENV"
          echo "---- container output (up to 80 lines) ----"
          sed -n '1,80p' /tmp/.turn-out.txt || true

          TURN_RESULT=$(sed 's/^TURN_RESULT=//' "$PWD/.turn-result.txt" | tail -1)
          # HOST-SIDE COMMIT (run 39488529938: the seat EDITED + VERIFIED but
          # its sandbox denied git/pytest — the edits died in the container,
          # branch pushed empty, work lost). The host commits the workspace
          # diff so a segment's work ALWAYS reaches the branch.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -m "turn(${SEAT}): segment work — host-committed" \
              -m "result: ${TURN_RESULT}" || echo "::notice::workspace commit failed"
          else
            echo "workspace clean — no host commit needed"
          fi
          echo "result=${TURN_RESULT}" >> "$GITHUB_OUTPUT"
          echo "## Turn — ${SEAT} @ ${GITHUB_SHA::7}" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "objective: ${OBJECTIVE}" >> "$SUMMARY"
          echo "task: ${TASK_ID:-none} (assignee: ${ASSIGNEE:-none}, chain ref: ${CHAIN_REF:-ai/main})" >> "$SUMMARY"
          echo "branch: ${BRANCH}" >> "$SUMMARY"
          echo "result: ${TURN_RESULT}" >> "$SUMMARY"
          echo "TURN_SEAT=$SEAT" >> "$GITHUB_ENV"
          rm -f "$PWD/.turn-inside.sh" "$PWD/.turn-result.txt" /tmp/.turn-out.txt /tmp/.turn-result.tmp

      # SESSION FILES (Owner order 2026-10-21 18:27Z "how will you handle
      # agents' session files? ... We need the session files to resume with
      # context for a team member. They are important."): the container is
      # --rm, so sessions die with it unless collected. The seat's tarball
      # is scrubbed file-by-file by the SECRET GUARD (a session that
      # swallowed a token must not leak it into the artifact), re-packed
      # and uploaded. Resume: the next turn of THIS seat downloads the
      # newest artifact and mounts it back into the container's $HOME.
      - name: Persist session files (scrub -> artifact)
        id: sess
        if: always() && steps.control.outputs.mode == 'work'
        env:
          SEAT: ${{ steps.control.outputs.seat }}
        run: |
          echo "found=no" >> "$GITHUB_OUTPUT"
          [ -s "$PWD/.turn-sessions.tgz" ] || { echo "sessions: nothing collected"; exit 0; }
          rm -rf /tmp/sess && mkdir -p /tmp/sess
          tar xzf "$PWD/.turn-sessions.tgz" -C /tmp/sess 2>/dev/null || true
          N=0
          while IFS= read -r f; do
            if out=$(bash .github/scripts/secret-guard.sh file "$f"); then N=$((N+1)); fi
          done < <(find /tmp/sess -type f 2>/dev/null)
          SESSP="${{ steps.control.outputs.sess_prefix }}"   # R-2-69: per-task session namespace
          TGZ="/tmp/${SESSP}${SEAT}-${GITHUB_RUN_NUMBER}.tgz"
          tar czf "$TGZ" -C /tmp/sess . 2>/dev/null || true
          if [ -s "$TGZ" ]; then
            # v4 upload-artifact rejects absolute paths outside the
            # workspace — copy in before upload (run 39485635406 failure)
            mkdir -p "$PWD/.sessions-upload"
            cp "$TGZ" "$PWD/.sessions-upload/"
            echo "found=yes" >> "$GITHUB_OUTPUT"
            echo "sessions: ${N} file(s) had secret hits — redacted before upload" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$PWD/.turn-sessions.tgz"

      - name: Upload session artifact (30-day retention)
        if: always() && steps.sess.outputs.found == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.control.outputs.sess_prefix }}${{ steps.control.outputs.seat }}-${{ github.run_number }}
          path: .sessions-upload/sessions-*.tgz
          retention-days: 30
          if-no-files-found: ignore

      # Peer-mesh law: the seat's branch is auto-merged by `finalize` right
      # after this step; ONLY the control-file pointer lands on ai/main here.
      - name: Push work branch, advance rotation, commit control file
        id: push
        if: always() && steps.control.outputs.mode == 'work'   # never stall the rotation on a step failure
        run: |
          # SECRET GUARD (Owner order 18:27Z): scan the whole branch diff
          # for leaked credential values and amend them out BEFORE push.
          bash .github/scripts/secret-guard.sh branch origin/ai/main
          # Rebase onto moved main before push (run 39488529938: branch born
          # from a stale base carried old workflow content — remote rejected
          # the ref creation). Converging with origin kills that class.
          git fetch origin +refs/heads/ai/main:refs/remotes/origin/ai/main || true
          git rebase origin/ai/main "${TURN_BRANCH:-ai/turn-orphan}" 2>/dev/null \
            || { git rebase --abort 2>/dev/null || true; echo "::warning::branch rebase skipped"; }
          git push origin "${TURN_BRANCH:-ai/turn-orphan}" || echo "::notice::no work branch to push"
          echo "branch=${TURN_BRANCH:-}" >> "$GITHUB_OUTPUT"
          # EMPTY-SEGMENT law (admincraft 2c): a lane exiting 0 with ZERO
          # commits is NOT progress — the commit count is a first-class
          # chain signal, consumed by finalize's stall accounting.
          COMMITS=0
          if git ls-remote --exit-code --heads origin "${TURN_BRANCH:-ai/turn-orphan}" >/dev/null 2>&1; then
            COMMITS=$(git rev-list --count "origin/ai/main..origin/${TURN_BRANCH}" 2>/dev/null || echo 0)
          fi
          echo "commits=${COMMITS:-0}" >> "$GITHUB_OUTPUT"
          echo "empty-segment check: ${COMMITS:-0} post-turn commit(s) on ${TURN_BRANCH:-no-branch}" >> "$GITHUB_STEP_SUMMARY"
          CTL=agent-team/TEAM-CONTROL.org
          case "${{ steps.control.outputs.seat }}" in
{{NEXT_MAP}}
          esac
          # R-2-69 POINTER ADVANCE: ai/main keeps the classic checkout+sed
          # +push; a task branch is THIN — rebuilt as trunk tip + this
          # task's control file (fetched fresh, carrying the new TURN
          # pointer in its CONTENT), then force-pushed. State lives in the
          # file; the per-ref concurrency group serializes the chain.
          git checkout -f "${CHAIN_REF:-ai/main}" 2>/dev/null || true
          CPUSH=no
          for i in 1 2 3; do
            git fetch origin +refs/heads/ai/main:refs/remotes/origin/ai/main
            git reset --hard origin/ai/main
            if [ "${CHAIN_REF:-ai/main}" != "ai/main" ]; then
              git show "origin/${CHAIN_REF}:agent-team/TEAM-CONTROL.org" > "$CTL" 2>/dev/null || true
            fi
            sed -i "s|^\#+TURN:.*|\#+TURN: ${NEXT}|" "$CTL"
            git add "$CTL"
            git commit -m "ci-turn: ${TURN_SEAT:-unknown} done — next turn ${NEXT}" \
              -m "result: ${TURN_RESULT:-unknown}" || { CPUSH=uptodate; break; }
            if [ "${CHAIN_REF:-ai/main}" != "ai/main" ]; then
              if git push --force origin "$CHAIN_REF"; then CPUSH=yes; break; fi
            else
              if git push origin "ai/main"; then CPUSH=yes; break; fi
            fi
            sleep 10
          done
          [ "$CPUSH" = "yes" ] || echo "::warning::control push failed after 3 attempts"

  # SELF-CHAIN — the last link of every turn (Owner order 2026-10-20 #hq
  # 14:52: unlimited runs, agents decide how many runs an objective takes).
  # After every segment:
  #   1. AUTO-MERGE the seat's work branch into ai/main behind the landing
  #      gate (re-merge race-proof vs moved main; branch deleted ONLY after
  #      a verified landing). Team chat and board notes propagate
  #      seat-to-seat with NO Lead in the loop (TEAM-CHAT.org is
  #      union-merged via .gitattributes, so concurrent appends never
  #      conflict). Red work never lands (merge undone, branch stays).
  #   2. Jev judgment (health-gated): weighs the stall state for the
  #      dispatch decision; gateway down -> local rules decide.
  #   3. Advance #+STALL-COUNT: +1 on a no-progress segment (dead seat,
  #      BLOCKED, conflict, gate red), reset to 0 when work lands.
  #   4. DISPATCH the next run itself while the objective is open and the
  #      kill switch is OFF. The chain stops ONLY on: KILL-SWITCH ON,
  #      OBJECTIVE-STATE COMPLETE, no objective. A no-progress streak
  #      (stall >= 4) does NOT kill the chain — it shifts to BACKOFF (next
  #      dispatch delayed 5 min per cycle) so a recovering lane is picked
  #      up automatically and the team keeps working.
  finalize:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [test, turn]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}   # R-2-69: the chain ref itself — ai/main trunk or the task branch

      # R-2-69: GITHUB_ENV is JOB-SCOPED — the turn job's CHAIN_REF never
      # crosses into finalize. Recompute it here (proof run 40218134008:
      # every task-aware branch in this job silently fell back to ai/main).
      - name: Resolve chain ref (task-branch law)
        run: |
          REF="${{ github.ref_name }}"
          case "$REF" in
            ai/main|ai/task/*) : ;;
            *) REF="ai/main" ;;
          esac
          echo "CHAIN_REF=$REF" >> "$GITHUB_ENV"
          echo "REF_SLUG=$(printf '%s' "$REF" | sed 's#^ai/##; s#/#-#g')" >> "$GITHUB_ENV"

      - name: Auto-merge the turn branch (peer mail propagation)
        id: merge
        run: |
          git config user.name "agent-team-ci"
          git config user.email "agent-team-ci@users.noreply.github.com"
          git remote set-url --push origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          BRANCH="${{ needs.turn.outputs.turn_branch }}"
          RESULT="${{ needs.turn.outputs.seg_result }}"
          OUTCOME="no-branch"
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            if git merge --no-ff --no-edit "origin/$BRANCH" 2>/dev/null; then
              OUTCOME="merged"
            elif git checkout HEAD -- agent-team/TEAM-CONTROL.org 2>/dev/null \
                 && git add agent-team/TEAM-CONTROL.org 2>/dev/null \
                 && git commit --no-edit >/dev/null 2>&1; then
              # R-2-69: the only legal cross-branch divergence is the
              # control file (task fork vs target) — the landing target
              # keeps ITS OWN control; everything else merges.
              OUTCOME="merged"
            else
              git merge --abort || true
              OUTCOME="conflict-left-for-lead"
            fi
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          echo "MERGE: $OUTCOME (branch: ${BRANCH:-none}, segment result: ${RESULT:-none})"

      - name: Landing gate, land the merge (race-proof vs moved main)
        id: gate
        if: steps.merge.outputs.outcome == 'merged'
        run: |
{{GATE_INSTALL}}
          BRANCH="${{ steps.merge.outputs.branch }}"
          # RACE PROOF (run 39485635406 evidence: the turn job's
          # control-file push landed between this job's fetch and push;
          # the gate push was rejected non-fast-forward AND the branch
          # was deleted — the segment's 73-turn work was orphaned).
          # Re-fetch + re-merge against moved main, push with retry;
          # the branch is deleted ONLY after a verified landing.
          RESULT=conflict
          # R-2-69: trunk pre-landing sha — task chains use it as the chat
          # mirror diff base (their chat entries land HERE, on the trunk).
          echo "trunk_pre=$(git rev-parse origin/ai/main 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
          for i in 1 2 3; do
            git fetch origin +refs/heads/ai/main:refs/remotes/origin/ai/main
            git reset --hard origin/ai/main
            if ! git merge --no-ff --no-edit "origin/$BRANCH" 2>/dev/null; then
              if ! git checkout HEAD -- agent-team/TEAM-CONTROL.org 2>/dev/null \
                   || ! git add agent-team/TEAM-CONTROL.org 2>/dev/null \
                   || ! git commit --no-edit >/dev/null 2>&1; then
                git merge --abort || true
                echo "attempt $i: merge conflict vs moved main — retrying"
                sleep 15
                continue
              fi
            fi
            if {{GATE_SH}}; then
              bash .github/scripts/secret-guard.sh staged
              if git push origin "ai/main"; then RESULT=green; break; fi
              RESULT=push-retry
              sleep 15
            else
              git reset --hard origin/ai/main
              RESULT=red
              echo "gate red on attempt $i — merge undone, branch kept for the Lead"
              break
            fi
          done
          case "$RESULT" in
            green)
              echo "gate=green" >> "$GITHUB_OUTPUT"
              git push origin --delete "$BRANCH" || true ;;
            red)
              echo "gate=red-merge-undone" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "gate=conflict-branch-kept" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Pause-after-TODO review (admincraft pause law 2b)
        id: pause
        if: always() && steps.gate.outputs.gate == 'green'
        run: |
          # Owner-invented in admincraft; DEFAULT ON per Owner order
          # 2026-10-22 17:28Z ("PAUSE AFTER TODO MUST BE DEFAULT"): a
          # MISSING key pauses — fail-safe against runaway burn. The
          # 17:19Z capability stands as the override: an explicit
          # #+PAUSE-AFTER-TODO: OFF runs the chain CONTINUOUSLY across
          # multiple TODOs (no halting between deliveries). With ON (or
          # missing) + the segment diff carrying a :DELIVERED: marker on
          # the board -> decision=paused-todo-review -> arm
          # #+CHAIN-PAUSE: ON. The next run halts in mode=paused (clean,
          # no burn); the LEAD reviews and clears the marker to resume.
          CTL=agent-team/TEAM-CONTROL.org
          BASE="${{ needs.turn.outputs.base_sha }}"
          # R-2-69: task chains delivered board notes via the TRUNK landing —
          # diff trunk pre..post landing instead of the thin task branch.
          PB="$BASE"; PE="HEAD"
          if [ "${CHAIN_REF:-ai/main}" != "ai/main" ]; then
            PB="${{ steps.gate.outputs.trunk_pre }}"; PE="origin/ai/main"
          fi
          DELIV=$(git diff "$PB" "$PE" -- agent-team/TODOS.org 2>/dev/null \
            | grep '^+' | grep -v '^+++' | grep -c ':DELIVERED:' || true)
          PAUSE_AFTER=$(grep -oP '^\#\+PAUSE-AFTER-TODO:\s*\K\w+' "$CTL" | head -1 || true)
          if [ "${PAUSE_AFTER:-ON}" = "ON" ] && [ "${DELIV:-0}" -gt 0 ]; then
            git config user.name "agent-team-ci"
            git config user.email "agent-team-ci@users.noreply.github.com"
            git remote set-url --push origin \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            ARMED=no
            for i in 1 2 3; do
              git fetch origin +refs/heads/ai/main:refs/remotes/origin/ai/main
              git reset --hard origin/ai/main
              if [ "${CHAIN_REF:-ai/main}" != "ai/main" ]; then
                git show "origin/${CHAIN_REF}:agent-team/TEAM-CONTROL.org" > "$CTL" 2>/dev/null || true
              fi
              grep -q '^#+CHAIN-PAUSE:' "$CTL" \
                && sed -i "s|^#+CHAIN-PAUSE:.*|#+CHAIN-PAUSE: ON|" "$CTL" \
                || printf '#+CHAIN-PAUSE: ON\n' >> "$CTL"
              git add "$CTL"
              git commit -m "ci-chain: pause-after-todo armed (${DELIV} delivered TODO(s) this segment)" || break
              if [ "${CHAIN_REF:-ai/main}" != "ai/main" ]; then
                git push --force origin "${CHAIN_REF}" && ARMED=yes && break
              elif git push origin "ai/main"; then ARMED=yes; break; fi
            done
            echo "PAUSED_TODOS=${DELIV}" >> "$GITHUB_OUTPUT"
            echo "pause-after-todo: ${DELIV} delivered TODO(s) — chain armed to pause (push ${ARMED}); Lead clears #+CHAIN-PAUSE to resume" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pause-after-todo: ${DELIV:-0} delivered TODO(s), PAUSE-AFTER-TODO=${PAUSE_AFTER:-ON} (OFF = Owner's continuous-run override) — no pause" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Resolve gateway (override -> deployment -> local -> boot — Owner order 2026-10-22)
        if: always()
        env:
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}
          GOMODEL_GATEWAY_OVERRIDE: ${{ vars.GOMODEL_GATEWAY_URL }}
        run: |
          set -u
          # Owner resolution law (2026-10-22): 1) vars.GOMODEL_GATEWAY_URL
          # override wins when set; 2) https://ai.khalidrafi.tech — the
          # deployment; 3) http://localhost:8080 — an already-running
          # listener; 4) ONLY when nothing answers does the next step boot
          # gomodel inside the runner (nothing answers == no deployment is
          # active right now). Every tier uses the ping contract
          # (agent-team-gateway-ping): GET / -> 404/200 = UP, else down.
          # The judgment lane is BINARY and rides no provider chain: Jev
          # via the resolved gateway when it is up, else the chain decides
          # directly (local rules) — never red.
          SUMMARY="$GITHUB_STEP_SUMMARY"
          ping() {
            curl -s -o /dev/null -m 20 -w '%{http_code}' \
              -H "Authorization: Bearer ${GOMODEL_MASTER_KEY:-}" "$1/" || echo 000
          }
          if [ -n "${GOMODEL_GATEWAY_OVERRIDE:-}" ]; then
            echo "GOMODEL_GATEWAY_URL=${GOMODEL_GATEWAY_OVERRIDE}" >> "$GITHUB_ENV"
            echo "GOMODEL_BOOT=skip" >> "$GITHUB_ENV"
            echo "gateway: vars.GOMODEL_GATEWAY_URL override in force (${GOMODEL_GATEWAY_OVERRIDE}) — health step still gates it" >> "$SUMMARY"
            exit 0
          fi
          CODE=$(ping "https://ai.khalidrafi.tech")
          if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
            echo "GOMODEL_GATEWAY_URL=https://ai.khalidrafi.tech" >> "$GITHUB_ENV"
            echo "GOMODEL_BOOT=skip" >> "$GITHUB_ENV"
            echo "gateway: deployment UP at ai.khalidrafi.tech (HTTP $CODE) — in-runner boot skipped" >> "$SUMMARY"
            exit 0
          fi
          REMOTE_CODE="$CODE"
          CODE=$(ping "http://localhost:8080")
          if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
            echo "GOMODEL_GATEWAY_URL=http://localhost:8080" >> "$GITHUB_ENV"
            echo "GOMODEL_BOOT=skip" >> "$GITHUB_ENV"
            echo "gateway: local listener UP at localhost:8080 (HTTP $CODE) — in-runner boot skipped" >> "$SUMMARY"
            exit 0
          fi
          echo "GOMODEL_GATEWAY_URL=http://localhost:8080" >> "$GITHUB_ENV"
          echo "GOMODEL_BOOT=boot" >> "$GITHUB_ENV"
          echo "gateway: nothing answers (ai.khalidrafi.tech HTTP ${REMOTE_CODE}, localhost:8080 HTTP ${CODE}) — next step boots gomodel in-runner (last resort)" >> "$SUMMARY"
          exit 0

      - name: GoModel gateway up (inside the runner — Owner order 2026-10-22)
        if: always() && env.GOMODEL_BOOT != 'skip'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -u
          if [ -z "${GH_PAT:-}" ]; then
            echo "::warning::GH_PAT missing — cannot clone khaalidrafi/llmfisher for the gateway config; gomodel lane stays DOWN -> fallback (never red)"
            exit 0
          fi
          rm -rf /tmp/llmfisher-src
          git clone --quiet --depth 1 \
            "https://x-access-token:${GH_PAT}@github.com/khaalidrafi/llmfisher" \
            /tmp/llmfisher-src
          docker rm -f gomodel >/dev/null 2>&1 || true
          # Tuned env block = llmfisher docker-compose.yml gomodel service
          # verbatim (field types checked per the GoModel source; a wrong
          # shape is a crash loop, not a warning). Keys ride as env only
          # (env-var law): nothing baked, nothing printed, nothing in git.
          export JEV_API_KEY="${TYPESAFE_API_KEY:-}"
          docker run -d --name gomodel -p 127.0.0.1:8080:8080 \
            -v /tmp/llmfisher-src/config:/app/config:ro \
            -v gomodel_data:/app/data \
            -e SQLITE_PATH=/app/data/gomodel.db \
            -e CONFIGURED_PROVIDER_MODELS_MODE=allowlist \
            -e FAILOVER_RETRY_ON_STATUSES=4xx,5xx \
            -e FAILOVER_MAX_ATTEMPTS=5 \
            -e RETRY_MAX_RETRIES=1 \
            -e RETRY_INITIAL_BACKOFF=3s \
            -e CIRCUIT_BREAKER_SCOPE=model \
            -e HTTP_RESPONSE_HEADER_TIMEOUT=30 \
            -e CACHE_REFRESH_INTERVAL=21600 \
            -e PROVIDER_RECHECK_INTERVAL=300 \
            -e LOG_LEVEL=info \
            -e PROVIDER_PROMPT_CACHE_PLANNER_ENABLED=false \
            -e GOMODEL_DEMO_MODE=false \
            -e GOMODEL_MASTER_KEY -e JEV_API_KEY \
            enterpilot/gomodel >/dev/null
          ok=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -m 2 -w '%{http_code}' \
              -H "Authorization: Bearer ${GOMODEL_MASTER_KEY:-}" \
              "http://localhost:8080/" || echo 000)
            if [ "$CODE" = "404" ] || [ "$CODE" = "200" ]; then
              echo "GoModel gateway UP inside the runner (HTTP $CODE, ping contract)"
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::warning::gomodel container did not answer in 30s — lane stays DOWN -> fallback (never red)"
            docker logs --tail 20 gomodel 2>&1 \
              | sed 's/[A-Za-z0-9+/=_-]\{20,\}/[redacted]/g' || true
          fi
          exit 0

      - name: Jev judgment (GoModel via llmfisher gateway — chain decision layer)
        if: always()
        env:
          GOMODEL_MASTER_KEY: ${{ secrets.GOMODEL_MASTER_KEY }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          # Owner order (re-issued 2026-10-21 08:25Z): use gomodel via
          # khaalidrafi/llmfisher on CI. Jev (model jev-1.13.0, POST
          # /v1/systemone) is the chain's calibrated judgment layer — it
          # weighs the stall state for the dispatch decision. Payload
          # mirrors agent-team.el agent-team--jev-payload byte-for-byte.
          CODE=$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
                  -H "Authorization: Bearer ${GOMODEL_MASTER_KEY}" \
                  "${GOMODEL_GATEWAY_URL}/" || echo 000)
          if [ "$CODE" != "404" ] && [ "$CODE" != "200" ]; then
            echo "jev: gateway DOWN (HTTP $CODE) — local rules decided the chain step (lane-fallback law; gomodel auto-resumes when the box answers)" >> "$SUMMARY"
            exit 0
          fi
          RESULT="${{ needs.turn.outputs.seg_result }}"
          OUTCOME="${{ steps.merge.outputs.outcome }}"
          STATE="stall state: segment result ${RESULT:-none}, merge outcome ${OUTCOME:-none}, CI chain deciding whether to dispatch the next turn now or back off."
          BODY=$(jq -nc --arg s "$STATE" \
            --arg q "Dispatch the next agent-team CI turn immediately (yes) or back off (no)?" \
            '{state: $s, model: "jev-1.13.0", questions: {q: {type: "noul", instructions: $q}}}')
          RESP=$(curl -s -m 90 -X POST \
                  -H "Authorization: Bearer ${GOMODEL_MASTER_KEY}" \
                  -H "Content-Type: application/json" \
                  -d "$BODY" \
                  "${GOMODEL_GATEWAY_URL}/v1/systemone" || echo '{}')
          P=$(echo "$RESP" | jq -r '.answers.q.noul // empty' 2>/dev/null)
          if [ -n "$P" ]; then
            VERDICT=$(awk -v p="$P" 'BEGIN{print (p>=0.5) ? "yes" : "no"}')
            echo "jev: ${P} -> ${VERDICT} (gomodel via llmfisher gateway, HTTP $CODE)" >> "$SUMMARY"
          else
            echo "jev: gateway answered but no noul in response — local rules decided (never block the chain on a judgment lane)" >> "$SUMMARY"
          fi

      - name: Stall accounting + dispatch the next run (self-chain)
        run: |
          CTL=agent-team/TEAM-CONTROL.org
          if [ "${CHAIN_REF:-ai/main}" != "ai/main" ]; then
            # R-2-69: read THIS task's control state (the working tree may
            # be the trunk after the landing gate; the task state lives on
            # the task branch blob).
            git fetch origin +refs/heads/"${CHAIN_REF}":refs/remotes/origin/"${CHAIN_REF}" || true
            git show "origin/${CHAIN_REF}:agent-team/TEAM-CONTROL.org" > "$CTL" 2>/dev/null || true
          fi
          RESULT="${{ needs.turn.outputs.seg_result }}"
          OUTCOME="${{ steps.merge.outputs.outcome }}"
          GATE="${{ steps.gate.outputs.gate }}"
          STALL=$(grep -oP '^\#\+STALL-COUNT:\s*\K\d+' "$CTL" | head -1 || true); STALL=${STALL:-0}
          PROGRESS=no
          if [ "$OUTCOME" = "merged" ] && [ "$GATE" = "green" ]; then PROGRESS=yes; fi
          case "$RESULT" in *BLOCKED*) PROGRESS=no ;; esac
          if [ "$PROGRESS" = "yes" ]; then NEW=0; else NEW=$((STALL+1)); fi
          if [ "$NEW" != "$STALL" ]; then
            # Race-proof (Lead pushes can move ai/main mid-run — same class
            # as the 15:57Z fetch-first rejection): reset, re-apply, commit.
            git fetch origin +refs/heads/ai/main:refs/remotes/origin/ai/main
            git reset --hard origin/ai/main
            if [ "${CHAIN_REF:-ai/main}" != "ai/main" ]; then
              git show "origin/${CHAIN_REF}:agent-team/TEAM-CONTROL.org" > "$CTL" 2>/dev/null || true
            fi
            sed -i "s|^\#+STALL-COUNT:.*|\#+STALL-COUNT: ${NEW}|" "$CTL"
            git add "$CTL"
            git commit -m "ci-chain: stall=${NEW} (segment ${OUTCOME}, result ${RESULT:-none})" \
              || echo "::notice::stall commit empty"
            if [ "${CHAIN_REF:-ai/main}" != "ai/main" ]; then
              git push --force origin "${CHAIN_REF}" || echo "::warning::stall push failed"
            else
              git push origin "ai/main" || echo "::warning::stall push failed"
            fi
          fi
          # Decide the next link in the chain
          KILL=$(grep -oP '^\#\+KILL-SWITCH:\s*\K\w+' "$CTL" | head -1 || true)
          OBJSTATE=$(grep -oP '^\#\+OBJECTIVE-STATE:\s*\K\w+' "$CTL" | head -1 || true)
          OBJECTIVE=$(grep -oP '^\#\+OBJECTIVE:\s*\K.*' "$CTL" | head -1 || true)
          DECISION="dispatch"
          if [ "${KILL:-OFF}" = "ON" ]; then DECISION="kill-switch"; fi
          if [ "${OBJSTATE:-OPEN}" = "COMPLETE" ]; then DECISION="objective-complete"; fi
          if [ -z "$OBJECTIVE" ] || echo "$OBJECTIVE" | grep -q "the Owner writes"; then
            DECISION="no-objective"
          fi
          # Pause law: a freshly armed CHAIN-PAUSE overrides dispatch —
          # the Owner reviews the delivery first (step above armed it).
          PAUSE=$(grep -oP '^\#\+CHAIN-PAUSE:\s*\K\w+' "$CTL" | head -1 || true)
          if [ "${PAUSE:-OFF}" = "ON" ]; then DECISION="paused-todo-review"; fi
          # EMPTY-SEGMENT law (2c): zero post-turn commits is visible in
          # the accounting, never silently counted as work.
          COMMITS="${{ needs.turn.outputs.commits }}"
          if [ "${COMMITS:-0}" = "0" ] && [ "$OUTCOME" != "merged" ]; then
            echo "empty segment: lane delivered 0 commits — counted as no-progress" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Tests red = no agent can even run (turn needs a green suite):
          # chaining would spin red forever. Halt and page the Lead.
          if [ "${{ needs.test.result }}" = "failure" ]; then
            DECISION="tests-red-halt"
          fi
          if [ "$NEW" -ge 4 ] && [ "$DECISION" = "dispatch" ]; then
            DECISION="backoff-dispatch"   # slow-poll: transient dead lanes recover on their own
          fi
          # (The old Discord-mirror exports of CHAIN_DECISION/CHAIN_STALL
          # retired with the mirror — Owner 2026-10-26 #hq.)
          DISPATCH_CODE="n/a"
          if [ "$DECISION" = "dispatch" ] || [ "$DECISION" = "backoff-dispatch" ]; then
            if [ "$DECISION" = "backoff-dispatch" ]; then
              echo "backoff: lane dead ${NEW} segments straight — waiting 5 min before the next attempt"
              sleep 300
            else
              sleep 20   # let the control push settle; the concurrency group serializes anyway
            fi
            DISPATCH_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/{{WORKFLOW_FILE}}/dispatches" \
              -d "$(jq -nc --arg r "${CHAIN_REF:-ai/main}" '{ref:$r}')")   # R-2-69: re-dispatch THIS chain's ref
          fi
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "## Chain — finalize" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "- merge: ${OUTCOME} (${{ steps.merge.outputs.branch }})" >> "$SUMMARY"
          echo "- landing gate: ${GATE:-skipped}" >> "$SUMMARY"
          echo "- stall count: ${NEW} (>=4 = 5-min backoff mode)" >> "$SUMMARY"
          echo "- post-turn commits: ${COMMITS:-?} (0 = empty segment — not progress)" >> "$SUMMARY"
          echo "- chain decision: **${DECISION}** (dispatch HTTP ${DISPATCH_CODE})" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "kill=${KILL:-OFF} state=${OBJSTATE:-OPEN}" >> "$SUMMARY"

      # (Discord mirror retired — Owner order 2026-10-26 #hq: "remv
      # discord, too." NO outbound chat mirror remains — Telegram retired
      # 2026-10-25, Discord retired 2026-10-26. The chain verdict lands in
      # the run summary; the team chat lives in agent-team/TEAM-CHAT.org on
      # the repo. The Lead reads it there and couriers Owner-bound entries
      # (FROM:/TO: lines) to the Owner's #hq channel by hand.)
